name: Windows Release

on:
  workflow_dispatch:
    inputs:
      package_release:
        description: 'Package release binaries'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Windows Release Build & Package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Run workspace tests
        run: cargo test --release --workspace

      - name: Package portable ZIP
        run: |
          mkdir staging
          cp target/release/ventacore-app.exe staging/
          cp target/release/ventacore-cli.exe staging/
          cp README.md staging/
          cp LICENSE staging/
          Compress-Archive -Path staging/* -DestinationPath target/ventacore-windows-x64-portable.zip

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ventacore-windows-x64-portable
          path: target/ventacore-windows-x64-portable.zip
